[worldserver]

###################################################################################################
# mod-esteria-garrison
#
# Draenor garrison, following UWoW's loop (personal instance of the tier map, plot placement,
# construction timer, resource cache, work orders, followers and missions). The tier maps are the
# retail ones UWoW uses: Alliance 1158 / 1331 / 1159, Horde 1152 / 1330 / 1153. The client needs
# those Map.dbc rows and a Retail alias for each map's WDT, or entering the garrison has no terrain.
#
#    EsteriaGarrison.Enable
#        Description: Garrison opcodes, the instance hook and the .garrison command.
#        Default:     0
#
#    EsteriaGarrison.BuildTimeScale
#        Description: Multiplier on a building's retail build time (3600 seconds at 1).
#        Default:     1
#
#    EsteriaGarrison.StartingResources
#        Description: Garrison resources a new garrison starts with.
#        Default:     500
#
###################################################################################################

EsteriaGarrison.Enable = 1
EsteriaGarrison.BuildTimeScale = 1
EsteriaGarrison.StartingResources = 500
